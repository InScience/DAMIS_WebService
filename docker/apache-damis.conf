# DamisService: SOAP CGI + result files.
# Not meant to be public: the service downloads any URL it receives in the X parameter.
<VirtualHost *:80>
    DocumentRoot /var/www/html

    # an algorithm may run up to MAX_RUN_TIME (default 3300 s) inside one CGI request
    Timeout 3600

    ScriptAlias /cgi-bin/ /usr/lib/cgi-bin/
    <Directory /usr/lib/cgi-bin>
        Options +ExecCGI -Indexes
        AllowOverride None
        Require all granted
        # settings.csv lives next to the binary
        <Files "settings.csv">
            Require all denied
        </Files>
    </Directory>

    # results (Y / Yalt) returned to the client; only _output_* files are downloadable
    Alias /DamisData/ /var/lib/damis/data/
    <Directory /var/lib/damis/data>
        Options -Indexes -ExecCGI -FollowSymLinks
        AllowOverride None
        Require all denied
        <FilesMatch "^_output_[A-Za-z0-9]+\.arff$">
            Require all granted
            ForceType "text/plain; charset=utf-8"
        </FilesMatch>
    </Directory>

    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>
